<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#020611" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="scan-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.7)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slight-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; letter-spacing: 0.5px; }
    .stat-val { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
    .stat-lbl { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }

    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.97); }
      50% { opacity: 0.75; transform: scale(1.03); }
      100% { opacity: 0.25; transform: scale(0.97); }
    }

    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.85; }
      100% { transform: translateY(330px); opacity: 0.2; }
    }

    @keyframes orbit-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes ping {
      0% { r: 4px; opacity: 0.9; }
      100% { r: 24px; opacity: 0; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulse-glow { animation: pulse 4s infinite ease-in-out; }
    .scanning-beam { animation: scan 3.5s infinite ease-in-out; }
    .orbit-anim { animation: orbit-cw 20s infinite linear; transform-origin: 1010px 200px; }
    .orbit-anim-reverse { animation: orbit-cw 28s infinite linear reverse; transform-origin: 1010px 200px; }
    .signal-ping { animation: ping 2.5s infinite cubic-bezier(0, 0, 0.2, 1); }
    .dash-flow { animation: dash 2s infinite linear; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Starfield Dots -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="95" cy="45" r="1.2" />
    <circle cx="210" cy="85" r="1.5" />
    <circle cx="340" cy="35" r="1" />
    <circle cx="480" cy="90" r="1.3" />
    <circle cx="620" cy="50" r="1" />
    <circle cx="750" cy="110" r="1.6" opacity="0.7" />
    <circle cx="870" cy="40" r="1.2" />
    <circle cx="1130" cy="70" r="1.4" />
    <circle cx="150" cy="340" r="1.1" />
    <circle cx="280" cy="375" r="1.4" />
    <circle cx="560" cy="355" r="1.2" />
    <circle cx="710" cy="365" r="1.5" />
    <circle cx="840" cy="345" r="1" />
    <circle cx="1160" cy="360" r="1.3" />
  </g>

  <!-- Coordinate Grid Overlay -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Decorative Glow Orbs -->
  <circle cx="160" cy="110" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-glow" />
  <circle cx="1010" cy="200" r="170" fill="#6366f1" opacity="0.18" filter="url(#glow)" class="pulse-glow" />

  <!-- Animated Scanning Beam -->
  <rect x="50" y="35" width="1100" height="3" fill="url(#scan-line)" class="scanning-beam" />

  <!-- Left Content Group -->
  <!-- Top Tag -->
  <g transform="translate(80, 65)">
    <rect width="295" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle cx="18" cy="16" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
    <text x="34" y="21" class="badge-text">SATELLITE OPS &amp; GSaaS PLATFORMS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" class="title">Awesome Satellite Operations</text>

  <!-- Subtitle -->
  <text x="80" y="185" class="subtitle">Curated SaaS Platforms, Ground Station Networks &amp; Open-Source Mission Control Systems</text>

  <!-- Accent Gradient Divider -->
  <rect x="80" y="215" width="580" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Metric Cards -->
  <g transform="translate(80, 250)">
    <!-- Card 1: Commercial -->
    <rect x="0" y="0" width="200" height="82" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="18" y="34" class="stat-val">15 Commercial</text>
    <text x="18" y="58" class="stat-lbl">SaaS &amp; GSaaS Providers</text>

    <!-- Card 2: Open Source -->
    <rect x="220" y="0" width="200" height="82" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="238" y="34" class="stat-val">50+ Repos</text>
    <text x="238" y="58" class="stat-lbl">C2, FSW, SDR &amp; Networks</text>

    <!-- Card 3: Standards -->
    <rect x="440" y="0" width="220" height="82" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="458" y="34" class="stat-val">TT&amp;C &amp; CCSDS</text>
    <text x="458" y="58" class="stat-lbl">Constellation Automation</text>
  </g>

  <!-- Right Graphic: Orbital Radar & Satellite Constellation -->
  <g transform="translate(0, 0)">
    <!-- Central Celestial Body / Ground Station Hub -->
    <circle cx="1010" cy="200" r="54" fill="url(#globe-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#slight-glow)" />
    <!-- Globe Latitude / Longitude lines -->
    <ellipse cx="1010" cy="200" rx="54" ry="20" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <ellipse cx="1010" cy="200" rx="20" ry="54" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <circle cx="1010" cy="200" r="6" fill="#38bdf8" />
    <!-- Ground Station Dish Icon inside Earth -->
    <path d="M1004,196 A8,8 0 0,1 1016,196 L1010,204 Z" fill="#38bdf8" />
    <line x1="1010" y1="204" x2="1010" y2="210" stroke="#38bdf8" stroke-width="2" />
    <!-- Radio Transmission Ping Ring -->
    <circle cx="1010" cy="200" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="signal-ping" />

    <!-- Orbit 1: Elliptical Inclined (LEO Orbit) -->
    <ellipse cx="1010" cy="200" rx="130" ry="55" transform="rotate(-25 1010 200)" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Orbit 2: Polar / High Inclination Orbit -->
    <ellipse cx="1010" cy="200" rx="145" ry="70" transform="rotate(55 1010 200)" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" stroke-dasharray="4,6" />

    <!-- Outer Geostationary Ring -->
    <circle cx="1010" cy="200" r="160" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" stroke-dasharray="2,6" />

    <!-- Animated Orbit Group 1 -->
    <g class="orbit-anim">
      <!-- Satellite 1 -->
      <g transform="translate(895, 175)">
        <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" />
        <rect x="-24" y="-4" width="14" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
        <line x1="-17" y1="-4" x2="-17" y2="4" stroke="#ffffff" stroke-width="0.75" />
        <rect x="10" y="-4" width="14" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
        <line x1="17" y1="-4" x2="17" y2="4" stroke="#ffffff" stroke-width="0.75" />
        <circle cx="0" cy="0" r="2.5" fill="#38bdf8" filter="url(#slight-glow)" />
      </g>
    </g>

    <!-- Animated Orbit Group 2 (Reverse Orbit) -->
    <g class="orbit-anim-reverse">
      <!-- Satellite 2 (CubeSat) -->
      <g transform="translate(1125, 245)">
        <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#cbd5e1" stroke="#8b5cf6" stroke-width="1.5" />
        <rect x="-17" y="-3.5" width="8" height="7" rx="1" fill="#6366f1" />
        <rect x="9" y="-3.5" width="8" height="7" rx="1" fill="#6366f1" />
        <circle cx="0" cy="0" r="2" fill="#10b981" />
      </g>
    </g>

    <!-- Downlink Beam (RF Link from Satellite to Ground Station) -->
    <line x1="910" y1="180" x2="1010" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" class="dash-flow" opacity="0.75" />
  </g>
</svg>